{{#partial "page"}}
<section class="tac-simple-page tac-simple-page--narrow">
  <h1>Checkout</h1>
  <p class="tac-simple-page__lede">Checkout uses BigCommerce Optimized Checkout on this storefront. Continue below if you are not redirected automatically.</p>
  <div class="tac-form__actions">
    <a class="tac-btn tac-btn--solid" href="{{urls.checkout.single_address}}">Continue to checkout</a>
    <a href="{{urls.cart}}">Back to cart</a>
  </div>
</section>
{{/partial}}
{{> layout/base}}

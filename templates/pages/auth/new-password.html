{{#partial "page"}}
<script type="application/json" id="tac-page-data">
{
  "newPasswordUrl": {{#if forms.new_password.submit_url}}{{{json forms.new_password.submit_url}}}{{else}}""{{/if}},
  "loginUrl": {{#if urls.auth.login}}{{{json urls.auth.login}}}{{else}}""{{/if}},
  "requirements": {{#if forms.new_password.requirements}}{{{json forms.new_password.requirements}}}{{else}}""{{/if}}
}
</script>
<template id="tac-live-new-password-error">
  {{#if forms.new_password.error}}<p class="tac-form__error" role="alert">{{{forms.new_password.error}}}</p>{{/if}}
</template>
{{{region name="pb_new_password"}}}
{{/partial}}
{{> layout/base}}

{{#partial "body_class"}}{{#if settings.account_creation_enabled}} tac-account-creation{{/if}}{{/partial}}
{{#partial "page"}}
<script type="application/json" id="tac-page-data">
{
  "saveAccountUrl": {{#if urls.auth.save_new_account}}{{{json urls.auth.save_new_account}}}{{else}}""{{/if}},
  "loginUrl": {{#if urls.auth.login}}{{{json urls.auth.login}}}{{else}}""{{/if}},
  "checkLoginUrl": {{#if urls.auth.check_login}}{{{json urls.auth.check_login}}}{{else}}""{{/if}},
  "accountUrl": {{#if urls.account.index}}{{{json urls.account.index}}}{{else}}""{{/if}}
}
</script>
<template id="tac-live-create-error">
  {{#if forms.create_account.error}}<p class="tac-form__error" role="alert">{{{forms.create_account.error}}}</p>{{/if}}
</template>
<template id="tac-live-create-fields">
  {{#each forms.create_account.account_fields}}
    {{{dynamicComponent 'components/common/forms'}}}
  {{/each}}
  {{#each forms.create_account.address_fields}}
    {{{dynamicComponent 'components/common/forms'}}}
  {{/each}}
</template>
<template id="tac-live-create-captcha">
  {{{forms.create_account.recaptcha.markup}}}
</template>
{{{region name="pb_create_account"}}}
{{/partial}}
{{> layout/base}}

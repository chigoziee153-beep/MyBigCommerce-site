{{#partial "page"}}
<script type="application/json" id="tac-page-data">
{
  "sendPasswordUrl": {{#if urls.auth.send_password_email}}{{{json urls.auth.send_password_email}}}{{else}}""{{/if}},
  "loginUrl": {{#if urls.auth.login}}{{{json urls.auth.login}}}{{else}}""{{/if}}
}
</script>
<template id="tac-live-forgot-error">
  {{#if forms.forgot_password.error}}<p class="tac-form__error" role="alert">{{{forms.forgot_password.error}}}</p>{{/if}}
</template>
<template id="tac-live-forgot-captcha">
  {{{forms.forgot_password.recaptcha.markup}}}
</template>
{{{region name="pb_forgot_password"}}}
{{/partial}}
{{> layout/base}}
